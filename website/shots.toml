# Every screenshot on the site, in one place. Taken by `screenshots.py`; used
# by `build.py` through the key (`shot = "pipeline-board"` in content.toml and
# features/*.toml). Capture fields: path or prep (where to point the browser),
# width (window, default 1200), top/height or from/until (the crop, in CSS px
# at 1x), thumb (the overview's picture for that page), newer (a made-up newer
# release, for the Upgrade button). Site fields: file, alt, address.


[home-dashboard]
file = "feature-home.png"
