# ─────────────────────────────────────────────────────────────────────
#  Hermit CRM website: every word on the page lives in this file.
#
#  1. Change the text between the quotes.
#  2. Run:   python3 build.py
#  3. Open:  site/index.html
#
#  Formatting you can use inside any text:
#     **bold**            ->  bold
#     `code`              ->  monospace, for file names and commands
#     [link text](url)    ->  a link
#
#  Text between """ and """ may run over several lines; line breaks
#  inside it are ignored, so wrap it however you like.
#  Leave [TBC] in place until the real value is known. The build lists
#  every [TBC] that is left, and warns about em dashes, exclamation
#  marks and the banned marketing words. `python3 build.py --release`
#  refuses to finish while any of those are left.
# ─────────────────────────────────────────────────────────────────────


# ── Values used in several places ────────────────────────────────────
[release]
version  = "0.6.0"
license  = "Apache 2.0"

[links]
download       = "download/hermitcrm-0.6.0.tar.gz"   # served by the site, see README
sha256         = "download/hermitcrm-0.6.0.tar.gz.sha256"
github         = "https://github.com/Hermit-CRM/hermit-crm"   # empty hides the GitHub links


# ── Browser tab, search results and link previews ────────────────────
[page]
title       = "Hermit CRM: a local CRM for one person, for Mac and Linux"
# Meta description for search results, at most 155 characters (longer ones
# are cut off). Leave empty to reuse [hero].subline.
description = """
A free, open-source CRM for founders and freelancers. Your companies, contacts
and conversations as plain files on your laptop, made for your AI tools.
"""
# Full address of the live site, e.g. "https://hermitcrm.io". Needed so
# link previews (LinkedIn, Slack) can find the share image.
site_url    = "https://hermitcrm.io"


# ── Top bar ──────────────────────────────────────────────────────────
[header]
name         = "Hermit CRM"
about_label  = "About"    # top right, links to /about/
github_label = "GitHub"


# ── First screen ─────────────────────────────────────────────────────
[hero]
h1 = "A CRM for one."
subline = """
A free, open-source CRM for founders, freelancers and anyone doing their own
sales. It keeps your companies, contacts and conversations as plain text files
on your laptop, and your own AI agent can reshape it to fit how you work. With a
pipeline, a calendar, dashboards and enrichment from a company's website.
"""
download_button = "Download for Mac and Linux"
sha256_label    = "SHA-256"


# ── Install with your AI ─────────────────────────────────────────────
[install]
label = "Install with your AI"
steps = [
  "**Unpack and open the folder in your AI coding tool:** Claude Code, Codex, Cursor, Gemini CLI, Grok Build or another.",
  "**Send it this message:**",
]
# The sentence people copy. The Copy button copies exactly this.
message      = "Read INSTALL.md and set up Hermit CRM for me."
copy_button  = "Copy"
copied_label = "Copied"
# Shown for 4 seconds when the browser refuses to copy; the message is then
# selected, so the visitor can copy it with the keyboard.
copy_failed_label = "Press ⌘C"


# ── What you get ─────────────────────────────────────────────────────
[features]
label = "What you get"

[[features.items]]
name = "Pipeline"
text = "A board from prospect to won, plus a follow-up radar for unanswered threads."

[[features.items]]
name = "Calendar"
text = "Overdue and due-today next steps, a month view, and a brief before each meeting."

[[features.items]]
name = "Companies and contacts"
text = "Sortable tables of companies and people, and one timeline per company of every email, call and meeting."

[[features.items]]
name = "Messages"
text = "Outreach drafts in English, German, Dutch or French, in your wording, and the outcome of every message."

[[features.items]]
name = "Reports"
text = "Weekly activity, funnel and conversion, time in stage, and which messages get answers."

[[features.items]]
name = "Dashboards"
text = "Pages of your own with lists, counts and bar charts. Describe one in a sentence, your AI builds it, and you pin it to the sidebar."


# ── The three principles (bold word, then the sentence) ──────────────
[[principles]]
name = "Local."
text = "It runs on your computer. Your data is a folder of Markdown files in git, on your own disk."

[[principles]]
name = "Your AI is the admin."
text = """
Plain files, a small CLI and an MCP server, so the agent you already use can
read your pipeline, log a call and change how Hermit works. Ask Hermit answers
questions on every page.
"""

[[principles]]
name = "Yours to change."
text = """
Press Adjust on any page and describe what you want: a dashboard, a field, a
page layout, a routine. Your agent builds it, every change can be undone, and
the code is open source.
"""


# ── Make it yours, with your own AI ──────────────────────────────────
# Shown between "One company, one file" and "What you get". Each example is
# the sentence you type, what changes in the data folder, and a screenshot of
# the result in site/img/ (taken on a demo folder at 2x; see the README).
[yours]
label   = "Adjust"
heading = "Make it yours, with your own AI."
promise = """
Say what you want in one sentence. Your own AI agent (Claude Code, Codex,
Cursor or Gemini CLI) builds it in your data folder, following recipes that
come with Hermit, and you see it on the next page load.
"""
prompt_label = "You type"
change_label = "What changes"
safety = """
**Safe to try.** Every change is a git commit you can undo in one click.
Routines only write drafts: they start paused, and Hermit never sends a
message.
"""

[[yours.examples]]
name    = "A dashboard from one sentence"
prompt  = "Make a dashboard called Monday review with my open deals, what is due this week and the deals by stage with their value. Pin it to the sidebar."
change  = "One new file, `dashboards/monday-review.toml`. The page is pinned in the sidebar, and every number opens the records behind it."
image   = "make-it-yours-dashboard.png"
alt     = "The Monday review dashboard in Hermit CRM, pinned in the sidebar: 3 open deals, 5 tasks due this week, the deals by stage and the open deals with their next step."
address = "127.0.0.1:8765/d/monday-review"

[[yours.examples]]
name    = "A new field"
prompt  = "Add a date field contract renewal to companies, shown on the company page and in the companies list."
change  = "Seven lines in `fields.toml`. The field shows on every company page, and as a column you can sort and filter in the companies list."
image   = "make-it-yours-field.png"
alt     = "A company page in Hermit CRM with the new contract renewal field: its date in the header, and its input with a line of help in the form."
address = "127.0.0.1:8765/companies/northwind-robotics"

[[yours.examples]]
name    = "A routine that drafts follow-ups"
prompt  = "Every morning, for people I messaged 7 days ago without a reply, draft a short follow-up. Never send anything."
change  = "A routine in `routines.toml`. It starts paused, so you see first who it would pick. Once you turn it on, its drafts wait on Home for you to edit and send yourself."
image   = "make-it-yours-routine.png"
alt     = "Home in Hermit CRM with a draft from the Nudge quiet threads routine: a short follow-up to a contact who has not replied in 20 days, with I sent it and Discard buttons."
address = "127.0.0.1:8765"


# ── One company, one file ────────────────────────────────────────────
[file]
label   = "The idea"
heading = "One company, one file."
# Screenshot of the app. Put the image in site/img/ and write its file
# name here, e.g. "pipeline.png" (1600 x 800, or 3200 x 1600 for sharp screens). While empty,
# the page shows a drawn placeholder of the pipeline board.
screenshot     = "pipeline.png"
screenshot_alt = "The Hermit CRM pipeline board in the browser, filled with made-up demo companies, Northwind Robotics among them."
address_bar    = "127.0.0.1:8765"
file_caption   = "The file behind the Northwind Robotics card:"
file_path      = "~/crm/companies/northwind-robotics/company.md"
# Shown exactly as written, line by line.
file_body = """
---
name: Northwind Robotics
website: northwind-robotics.com
country: DE
source: referral
stage: offer
stage_changed: 2026-09-15
value_eur_month: 4000
next_step: Follow up on the proposal
next_step_due: 2026-09-24
..."""


# ── Questions (open = true shows the answer when the page loads) ─────
[questions]
label = "Questions"

[[questions.items]]
q = "Where does my data live?"
a = """
In a folder on your Mac, `~/crm` unless you choose another. Every company,
contact and conversation is a Markdown file, and every change is a git
commit, so any mistake is one `git revert` away.
"""
open = true

[[questions.items]]
q = "Does anything leave my Mac?"
a = """
Only what you send. A private git backup, if you add one. The AI tool you
ask, when you use Ask Hermit or enrichment. A once-a-day version check with
no identifiers, which you can turn off.
"""
open = true

[[questions.items]]
q = "Do I need to be a developer?"
a = """
No. Your AI tool runs the commands and tells you in plain words what it is
doing. On a fresh Mac you click Install once in an Apple dialog.
"""

[[questions.items]]
q = "Does it run on Linux?"
a = """
Yes, but it is less tested than on a Mac. The install is the same: your AI
tool checks for git and Python and installs what is missing, which on Linux may
ask for your password. There is no keychain on Linux, so the mail password is
kept in a file only your user account can read.
"""

[[questions.items]]
q = "Which AI tools work?"
a = """
For the install, any AI coding tool that can read a file and run commands:
Claude Code, Codex, Cursor, Gemini CLI, Grok Build and others. Afterwards, Claude
Desktop, ChatGPT, Cursor or any other MCP client can read your pipeline and
log interactions.
"""

[[questions.items]]
q = "Does it work with my email and calendar?"
a = """
Yes, without OAuth. BCC or forward mail to an address such as
you+crm@gmail.com and it is logged on the right contact. Past meetings come
in from your calendar's secret ICS link (Google, Outlook or iCloud). You
type the app password and the link into the Settings page yourself, so they
never pass through an AI chat.
"""

[[questions.items]]
q = "Can my team use it?"
a = "No. Hermit CRM is built for one person. If you need a team CRM, use one of the others."

[[questions.items]]
q = "How does it compare with HubSpot, Attio or Pipedrive?"
a = """
Those are hosted CRMs for teams, priced per seat, with your data in their
cloud. Hermit CRM is free, for one person, and keeps your data on your own
computer. [Hermit CRM compared](compare/) puts it side by side with HubSpot,
Attio, Pipedrive, folk, Twenty and Notion, and says when each one is the
better choice.
"""

[[questions.items]]
q = "Does it run on Windows?"
a = "Not yet. Hermit CRM runs on macOS and Linux."

[[questions.items]]
q = "What does it cost?"
a = "Nothing. It is free and open source under the Apache License 2.0. It is alpha software with no warranty and no support; see DISCLAIMER.md in the download."


# ── Bottom of the page ───────────────────────────────────────────────
[footer]
# {github} is replaced by a link to [links].github labelled with
# [header].github_label, {sha256} by a link to [links].sha256.
text = "Hermit CRM · Apache License 2.0 · alpha, no warranty · {github} · {sha256} · [Compare](compare/) · [About](about/) · Built by [Gijs Bos](https://www.linkedin.com/in/gijsbos)"


