[[sections]]
heading = "What needs doing"
text = """
Your open tasks for the next seven days, soonest first, with the company or person each one is for.
An overdue date is red. **Done** ticks a task off from here, and a link under the table opens all tasks with their filters or the calendar.
The task due first for a company is marked **next step**.
"""
image   = "feature-home.png"
alt     = "The Hermit CRM home page: five tasks due this week with their companies, two replies owed to Jonas Brandt and Joris Veldkamp, and last month's numbers in four tiles."
