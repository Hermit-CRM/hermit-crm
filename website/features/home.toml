[[sections]]
heading = "Replies you owe"
text = """
Every message someone sent you that you have not answered, with the company, the person, how many
days they have waited and a line of what they wrote. Nothing to set up: Hermit reads the interactions
you logged, or that BCC and calendar capture logged for you.
"""

[[sections]]
heading = "How it is going"
text = """
Four numbers for the last 30 days, each with the change against the 30 days before: interactions,
companies touched, new companies and companies in the folder. The Reports page has the full version.
"""

[[sections]]
heading = "Getting started, until it is done"
text = """
A new folder opens on **Getting started** instead: twelve steps, each ticked when it has actually
happened, and a tour that points at each part of the screen. Press *Don't open this at startup*,
or tick every step, and the logo opens Home from then on.
"""
