order   = 6
name    = "Contacts"
nav     = "Contacts"
title   = "Contacts: every person and their history in Hermit CRM"
description = "Contacts in Hermit CRM: every person across your companies, a page per person with their roles, history and tasks, and three message drafts with no AI."
summary = "Every person across your companies, with a page of their own: roles, history, tasks and three message drafts."
intro = """
Contacts lists every person across all your companies. Each person has a page with what you last did,
who is waiting on whom, and the messages you could send next.
"""
docs    = "contacts"
related = ["companies", "messages", "extension"]

[[sections]]
heading = "Everyone in one table"
text = """
Name, company, title, email, LinkedIn, last touch and the number of interactions, with a filter and sort arrows on every column. The search at the top of the page
matches name, email, title and company.
"""
image   = "feature-contacts.png"
alt     = "The Hermit CRM Contacts table: nine demo people with their company, title, email, last touch and number of interactions, with a filter above each column."
address = "127.0.0.1:8765/contacts"

[[sections]]
heading = "A page per person"
text = """
At the top, four boxes: **last touch**, **waiting on** (red when you owe a reply), **next for** the person, and **history** in touches in and out.
Below: the details, with a role (champion, decision-maker, influencer or gatekeeper), the tasks you owe this person and a form to log an interaction.
There is no notes field: what you know about a person is a note on their timeline.
"""
image   = "feature-contact-page.png"
alt     = "A contact page in Hermit CRM for Jonas Brandt: last touch two days ago, a reply owed since 2026-10-15, his next task, his title, role and email, and a list of tasks."
address = "127.0.0.1:8765/companies/northwind-robotics/contacts/jonas-brandt"

[[sections]]
heading = "Log every touch"
text = """
An email, a LinkedIn message, a call, a WhatsApp message or a meeting, in or out, with the text kept exactly as you pasted it. A note is a memo
that shows on the timeline but never counts as contact made. Logging a first touch on a prospect moves the company to **engaged** in the same commit.
"""

[[sections]]
heading = "Three message drafts, written from your own data"
text = """
Each contact page offers three deliberately different drafts, in the contact's language (English, German, Dutch or French), built from what your CRM knows: the company, its team size and fields of your own.
No AI is involved. Square brackets are the parts only you can fill, so a draft never goes out quietly blank. Edit in place, copy, or **log as sent** and it becomes an interaction.
"""
image   = "feature-contact-drafts.png"
alt     = "The message drafts on a Hermit CRM contact page: three German drafts for Jonas Brandt with square brackets to fill in, above each a short description of its angle."
address = "127.0.0.1:8765/companies/northwind-robotics/contacts/jonas-brandt"

[[sections]]
heading = "Where people come from"
text = """
Add a person from a company page, import a list, capture a LinkedIn profile with the Extension, or let BCC and calendar capture add a new person at a company whose domain is known.
Delete a contact and their interactions stay on the company, so the record survives. Two entries for the same person can be merged.
"""
