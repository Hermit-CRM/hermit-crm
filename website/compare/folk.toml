[[faq]]
q = "Is Hermit CRM an alternative to folk?"
a = """
For one person, yes. folk is a hosted relationship CRM for small teams, with
enrichment and mail sync. Hermit CRM is a free local CRM for one person that
keeps the data in plain files on your computer.
"""

[[faq]]
q = "Can Hermit CRM add contacts from LinkedIn like folk?"
a = """
Yes, one at a time. Its bookmarklet turns a LinkedIn profile you are looking
at into a filled-in contact form, read in your own browser tab. It does not
look up email addresses for you.
"""

[[faq]]
q = "Does Hermit CRM enrich contacts?"
a = """
It fills in company details from a company's website for free, or through an
AI command line tool you already use, such as Claude or Codex. It has no
database of contact data of its own.
"""

