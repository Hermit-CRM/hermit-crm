title = "Hermit CRM vs folk: a free local CRM or a relationship CRM"
description = """
Hermit CRM vs folk on price, data, AI access and team use: when folk's relationship CRM fits better, and when a free local CRM does.
"""

best_for = "Small teams that manage relationships and outreach from LinkedIn and mail"
price    = "No free plan; from €22 a member a month billed yearly"

short_answer = """
Choose **folk** if you work with a small team, manage many relationships and
want contacts enriched and captured from LinkedIn and your mailbox for you.
Choose **Hermit CRM** if you work alone and want your companies, contacts and
conversations as plain files on your own computer, with AI tools reading them
directly. Hermit CRM is free; folk has a 14-day trial and starts at €22 a
member a month billed yearly.
"""

choose_other = [
  "A few people share the same contacts and pipelines.",
  "You want contacts enriched with emails and company data for you.",
  "You want mail campaigns and follow-ups sent from the CRM.",
  "You want a mobile app and a vendor that supports you.",
  "You work on Windows.",
]

choose_hermit = [
  "You work alone and want no subscription.",
