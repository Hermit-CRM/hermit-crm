[[faq]]
q = "Is Notion good enough as a CRM?"
a = """
For a short list of leads, often yes. It becomes work when you want mail
logged on contacts, reminders for follow-ups, and reports: in Notion you build
and maintain those yourself. Hermit CRM has them built in.
"""

[[faq]]
q = "Both keep Markdown. What is the difference?"
a = """
Notion stores your pages in its cloud and can export them as Markdown. Hermit
CRM stores them as Markdown from the start, in a folder on your computer, and
commits every change to git.
"""

[[faq]]
q = "Can I move my Notion CRM to Hermit CRM?"
a = """
Yes. Export the Notion database as CSV and import it in Hermit CRM. It shows a
preview first, and columns it has no field for are kept as notes.
"""

