[[faq]]
q = "Is Hermit CRM a free alternative to HubSpot?"
a = """
For one person, yes. Hermit CRM is free and open source and has no seats to
count. It does not replace HubSpot's marketing tools, and it is not built for
teams.
"""

[[faq]]
q = "Can I move my data from HubSpot to Hermit CRM?"
a = """
Companies and contacts, yes: export them from HubSpot as CSV or Excel and
import the files in Hermit CRM, which recognises HubSpot's column names. Email
history does not come across.
"""

[[faq]]
q = "Does Hermit CRM have AI like HubSpot?"
a = """
Hermit CRM has no AI of its own and no credits. It uses the AI tool you already
have: Ask Hermit sends your question to Claude, Codex, Gemini or another
command line tool on your computer, and agents can read the files or use the
MCP server.
"""

[[faq]]
q = "Is HubSpot's free CRM enough for a solo founder?"
a = """
Often, yes, if you are happy with your data in HubSpot's cloud. The free plan
covers up to 2 users. Hermit CRM is the choice when you want the data on your
own computer, in plain files your AI tools can read.
"""

