# fly.toml — Hermit CRM website (static)
# See https://fly.io/docs/reference/configuration/
#
# Public at https://hermitcrm.io; hermitcrm.fly.dev serves the same build, noindex.
# DNS for hermitcrm.io is at Cloudflare, "DNS only" (grey cloud) so Fly can
# issue the certificates: A @ -> the app's IPv4, AAAA @ -> its IPv6, CNAME www
# -> hermitcrm.fly.dev. Certificates: `flyctl certs list`. nginx sends www to
# the bare domain.

app = 'hermitcrm'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 80
  force_https = true
  # Scale to zero: the machine suspends when nobody is looking at the page and
  # boots again on the first request (about a second). Costs next to nothing.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '2s'
    interval = '30s'
    method = 'get'
    path = '/'
    timeout = '3s'

# The download log (see nginx.conf) lives on a 1 GB volume. Create it once with
#   flyctl volumes create downloads --region fra --size 1 --app hermitcrm
[[mounts]]
  source = 'downloads'
  destination = '/data'

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
