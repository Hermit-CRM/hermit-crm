# nginx for the Hermit CRM website on Fly.
#
# hermitcrm.io is public and indexable (robots.txt and sitemap.xml come from
# build.py). The same app also answers on hermitcrm.fly.dev; that copy says
# noindex, so search engines list the page once, under hermitcrm.io.

# This file lands in conf.d/, inside nginx's http block, where map belongs.
# An empty value means nginx sends no X-Robots-Tag header at all.
map $host $robots_tag {
    default            "";
    hermitcrm.fly.dev  "noindex, nofollow";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /compare/hubspot redirects to /compare/hubspot/. Fly ends TLS, so an
    # absolute redirect would point at http:// on port 80; a relative one
    # keeps the visitor on https://hermitcrm.io.
    absolute_redirect off;

    # llms.txt and the other text files are UTF-8 (they contain · and €).
    charset utf-8;
    charset_types text/plain text/css text/xml application/javascript;

    add_header X-Robots-Tag $robots_tag always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # The page loads only its own CSS and images. 'unsafe-inline' for scripts
    # is for the one inline <script> the build writes (the copy button); the
    # fix is to move it to its own file in build.py and drop back to 'self'.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Release files. Only `types` here: an add_header in this block would
    # drop the security headers above for these responses.
    location /download/ {
        types {
            application/gzip  gz;
            text/plain        sha256;
        }
        try_files $uri =404;
    }

    access_log off;
}

# hermitcrm.io is the address of record; www sends visitors there. Fly ends
# TLS and passes the original Host, so this block only sees www requests.
server {
    listen 80;
    listen [::]:80;
    server_name www.hermitcrm.io;
    return 301 https://hermitcrm.io$request_uri;
}
