# nginx for the Hermit CRM website on Fly.
#
# STAGING: the X-Robots-Tag header and the robots.txt below keep this build
# out of search engines. Remove both blocks when the site goes public.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- staging only -------------------------------------------------
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    # ------------------------------------------------------------------

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # The page loads only its own CSS and images. 'unsafe-inline' for scripts
    # is for the one inline <script> the build writes (the copy button); the
    # fix is to move it to its own file in build.py and drop back to 'self'.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    access_log off;
}

# hermitcrm.io is the address of record; www sends visitors there. Fly ends
# TLS and passes the original Host, so this block only sees www requests.
server {
    listen 80;
    listen [::]:80;
    server_name www.hermitcrm.io;
    return 301 https://hermitcrm.io$request_uri;
}
