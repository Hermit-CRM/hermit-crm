[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermitcrm"
dynamic = ["version"]
description = "A personal CRM that is a folder of Markdown files in git, built for one person and for AI agents."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hermit CRM contributors" }]
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "python-frontmatter",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
hermitcrm = "hermitcrm.cli:main"

[tool.setuptools.dynamic]
version = { attr = "hermitcrm.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermitcrm = ["templates/*.html", "static/*", "*.toml", "help/*.md"]
"hermitcrm.help" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
