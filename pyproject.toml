[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermitcrm"
dynamic = ["version"]
description = "A personal CRM that is a folder of Markdown files in git, built for one person and for AI agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Hermit CRM contributors" }]
requires-python = ">=3.11"
keywords = ["crm", "personal-crm", "markdown", "local-first", "git", "mcp", "ai-agents", "solopreneur", "freelancer", "sales"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "python-frontmatter",
    "pyyaml",
    "pypdf",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.urls]
Homepage = "https://hermitcrm.io/?ref=pypi"
Documentation = "https://hermitcrm.io/docs/?ref=pypi"
Changelog = "https://hermitcrm.io/changelog/?ref=pypi"
Source = "https://github.com/Hermit-CRM/hermit-crm"
Issues = "https://github.com/Hermit-CRM/hermit-crm/issues"
Funding = "https://ko-fi.com/gijsbos"

[project.scripts]
hermitcrm = "hermitcrm.cli:main"

[tool.setuptools.dynamic]
version = { attr = "hermitcrm.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermitcrm = ["templates/*.html", "static/*", "*.toml", "help/*.md"]
"hermitcrm.help" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_secret_service: runs the real secret-tool (CI keyring job only)"]
