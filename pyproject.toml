[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermitcrm"
dynamic = ["version"]
description = "A personal CRM that is a folder of Markdown files in git, built for one person and for AI agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Hermit CRM contributors" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "python-frontmatter",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.urls]
Homepage = "https://github.com/Hermit-CRM/hermit-crm"
Issues = "https://github.com/Hermit-CRM/hermit-crm/issues"

[project.scripts]
hermitcrm = "hermitcrm.cli:main"

[tool.setuptools.dynamic]
version = { attr = "hermitcrm.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermitcrm = ["templates/*.html", "static/*", "*.toml", "help/*.md"]
"hermitcrm.help" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
