{% extends "base.html" %}
{% import "macros.html" as m %}
{% block title %}New contact{% endblock %}
{% block content %}
<h1>New contact for <a href="/companies/{{ company.slug }}">{{ company.name }}</a></h1>
{{ m.errors_box(errors) }}
<form method="post" action="/companies/{{ company.slug }}/contacts" class="record-form">
  {{ m.contact_fields(values, errors) }}
  <button type="submit">Create contact</button>
</form>
{% endblock %}
