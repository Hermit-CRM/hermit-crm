{% extends "base.html" %}
{% block title %}Help: {{ title }}{% endblock %}
{% block content %}
<div class="helpdoc-layout">
  <div class="helpdoc-topics">
    <h2>Help</h2>
    <ul>
      {% for slug, name in topics %}<li{% if slug == topic %} class="current"{% endif %}><a href="/help/{{ slug }}">{{ name }}</a></li>{% endfor %}
    </ul>
    <p class="small">Same text: <code>hermitcrm help {{ '' if topic == 'index' else topic }}</code></p>
  </div>
  <article class="helpdoc">
{{ body | safe }}
  </article>
</div>
{% endblock %}
