{# Inline SVG icons (24x24, stroke = currentColor); no icon font, no requests. #}
{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'pipeline' %}<rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/>
{%- elif name == 'calendar' %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
{%- elif name == 'companies' %}<rect x="4" y="3" width="11" height="18" rx="1"/><path d="M15 9h5v12h-5M8 7h3M8 11h3M8 15h3"/>
{%- elif name == 'contacts' %}<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>
{%- elif name == 'messages' %}<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>
{%- elif name == 'reports' %}<path d="M3 21h18M6 17v-6M11 17V5M16 17v-9M21 17v-3"/>
{%- elif name == 'settings' %}<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>
{%- elif name == 'help' %}<circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.6 2.6 0 1 1 3.6 2.4c-.7.3-1.1.9-1.1 1.6v.3M12 17h.01"/>
{%- elif name == 'reload' %}<path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5"/>
{%- elif name == 'search' %}<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
{%- elif name == 'ask' %}<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>
{%- endif %}</svg>
{%- endmacro %}
