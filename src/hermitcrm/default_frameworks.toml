# Hermit CRM outreach frameworks: how a first-touch message is built.
#
# Do not edit this file in the package. Put a frameworks.toml in your data
# folder instead; it is deep-merged over this one, so a file that only sets
#
#   [frameworks.trigger-tension-trust]
#   max_words = 50
#
# keeps everything else. Add a framework by adding a [frameworks.<id>] table
# (an id is lower case letters, digits and hyphens). `hermitcrm check` reports
# what is wrong with your file; a framework with an error is left out.
#
# Who reads each key:
#   name          the AI (and people): what the framework is called
#   after         people: whose published method it follows, as credit
#   summary       people: one line on what it does
#   steps         the AI: the parts of the message, in order
#   max_words     Python: the longest message, in words (left out: the channel's limit)
#   cta           Python: the kind of closing question
#                 (situation-question, interest-question, small-step-question,
#                 easy-no, yes-no, reply-invite)
#   questions     Python: [min, max] questions in the message; max is 1
#   proof         Python: required, optional or never
#   offer_line    Python: required, optional or never
#   needs         Python: what the research must find (premise, personal-connection)
#   research      Python: how deep the research goes (none, trigger, individual)
#   best_for, watch_out, evidence, example
#                 people: when to pick it, what to watch, what we know, a sample
#   instructions  the AI: the text that goes into the draft prompt (at most 900 characters)
#   fits          reserved: accepted and not read yet

[frameworks.house]
name = "House style"
steps = ["Finding", "Offer", "Question"]
cta = "situation-question"
questions = [1, 1]
proof = "optional"
offer_line = "required"
research = "trigger"
instructions = '''
This is a first touch: they have never had a message from the seller.
- Open with one usable finding about them, in your own words. Never open with "I" (or Ich, Ik, Je): the first word is about them.
- Then the offer in one line.
- End with exactly one question, a diagnostic one about their situation (for example: where does it hurt most right now: pipeline, conversion or deal size?). One question mark in the whole message.
- No meeting ask, no call ask, no link, no proposed day or time.
- When no finding is usable, write from the playbook's general notes instead and mark what only the seller can fill in with [square brackets].'''

[frameworks.trigger-tension-trust]
name = "Trigger, tension, trust"
after = "Jason Bay"
steps = ["Trigger", "Tension", "Trust", "Question"]
max_words = 60
cta = "situation-question"
questions = [1, 1]
proof = "required"
offer_line = "never"
research = "trigger"
instructions = '''The first line makes clear the message is meant for them: a usable finding, ideally a trigger such as a hire, a launch or a funding round. Then one sentence on the problem that trigger usually creates, in plain words; never "all-in-one", "single source of truth", "AI-powered" or similar. Then one proof line in a sentence; do not explain how the offer works and do not state the offer line. End with one easy-to-answer question, such as whether this is on their radar right now. Under 60 words. The opener must connect to the rest of the message.'''

[frameworks.truth-think-proof-talk]
name = "Truth, think, proof, talk"
after = "Josh Braun"
steps = ["Truth", "Think", "Proof", "Talk"]
max_words = 80
cta = "easy-no"
questions = [1, 1]
proof = "required"
offer_line = "never"
research = "trigger"
instructions = '''Four parts. Truth: something observable and true about them, from a usable finding, that shows this is not a mass mail. Think: one neutral observation, a statement and not a question, that names a problem they may not have noticed; do not steer them toward a yes. Third-party proof: one proof line about similar companies, never a claim about the product. Talk: a low-pressure question that makes "no" an easy answer. Use the words the playbook's Personas and Voice sections use for the problem, not marketing words. Under 80 words. The subject names the Truth.'''

[frameworks.premise-body-ask]
name = "Premise, body, ask"
after = "Becc Holland"
steps = ["Premise", "Body", "Ask"]
max_words = 80
cta = "easy-no"
questions = [1, 1]
proof = "optional"
offer_line = "optional"
research = "individual"
needs = ["premise"]
instructions = '''Four to five short lines. Premise: the reason for writing to this person, taken from the best usable finding in this order: something they wrote or said; something they shared or commented on; their profile or headline; a personal interest; a company signal. Body: value that follows directly from that premise. Ask: one concrete question tied to the issue raised, followed by a clean way out (for example: if it is not relevant, say so and there will be no chasing). No self-praise such as awards or rankings, no "just checking in", no telling them to report back, no slang or false familiarity. Under 80 words.'''

[frameworks.problem-solution-question]
name = "Problem, solution, question"
after = "30 Minutes to President's Club"
steps = ["Problem", "Solution", "Question"]
max_words = 70
cta = "interest-question"
questions = [1, 1]
proof = "required"
offer_line = "optional"
research = "trigger"
instructions = '''Three short parts. First, a problem this person likely has right now, tied to one usable finding they will recognise, in plain problem words, never a category or buzzword. Second, one sentence on how the seller solves it, carried by one proof line. Third, one small question about whether the idea is worth a look. Never ask for a meeting. Under 70 words. The subject is short, tied to the finding, and reads like a note between colleagues, not a promotion.'''

[frameworks.attention-interest-desire-action]
name = "Attention, interest, desire, action"
after = "John Barrows"
steps = ["Attention", "Interest", "Desire", "Action"]
max_words = 90
cta = "small-step-question"
questions = [1, 1]
proof = "optional"
offer_line = "optional"
research = "trigger"
instructions = '''Four steps. Attention: the first sentence is a specific fact about them from a usable finding; no self-introduction in the first ten words. Interest: tie it to a business problem their role cares about. Desire: what becomes possible once it is fixed, with one concrete example (a proof line if one fits). Action: one step smaller than a meeting that the seller can really offer according to the playbook's Offer section, asked as the only question. Under 90 words. The subject is about them.'''

[frameworks.connection-problem-objection]
name = "Connection, problem, objection"
after = "Sam McKenna"
steps = ["Connection", "Problem", "Objection", "Invitation"]
cta = "reply-invite"
questions = [0, 1]
proof = "optional"
offer_line = "never"
research = "individual"
needs = ["personal-connection"]
instructions = '''Subject: two or three facts about them that only they would recognise together, from usable findings. Open with the connection the seller added (a finding from "you") and the seller's own view on it; never a bare name-drop, and never a connection that was not given. Bridge to a specific, recognisable problem people in their role commonly have. Name the objection they are probably thinking and answer it in one sentence. Close with an open invitation to reply; it may be a statement rather than a question (for example: if it is not relevant, tell me and I will drop it). At most one question.'''

[frameworks.pain-proof-yes-no]
name = "Pain, proof, yes or no"
after = "Justin Michael"
steps = ["Pain", "Fix", "Proof", "Yes or no"]
max_words = 45
cta = "yes-no"
questions = [1, 1]
proof = "required"
offer_line = "never"
research = "trigger"
instructions = '''One to three sentences after the greeting. A pain or fear this person has, or a recent event about them; a hint at the fix; one proof line with its specific number. End with a question they can answer yes or no about their situation. Never ask for minutes of their time or a meeting. No small talk, no "my name is". Assertive and plain. The subject is one to three words. Greeting and sign-off follow the culture norms. Under 45 words.'''
