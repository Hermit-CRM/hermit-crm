# Hermit CRM default outreach templates: reply, follow-up and culture templates in four languages.
#
# Do not edit this file in the package. Put a messages.toml in your data
# folder instead; it is deep-merged over this one, so a file that only sets
#
#   [languages.en]
#   signoff = "Best,\n{owner_first_name}"
#
# keeps everything else. Add a language by adding a [languages.xx] table and
# mapping countries to it (see LANGUAGE_BY_COUNTRY in hermitcrm/models.py).
#
# Square brackets mark what only you can fill in.

[signals]
"" = "not checked yet"
growing = "growing fast (LinkedIn insights)"
stalled = "growth levelling off"
declining = "headcount decline"
hiring = "hiring for a role you can help with"

# ------------------------------------------------------------------ English
[languages.en]
name = "English"
greeting = "Hi {first},"
signoff = "{owner_first_name}"
observation = "[One thing that struck you on {site}, in one sentence.]"

[languages.en.growth]
growing = "{company} is growing fast."
stalled = "{company} has come a long way, but growth seems to be levelling off a bit."
declining = "{company} has come a long way, but the team has been getting smaller lately."
"" = "{company} [is growing fast / has come a long way]."

[languages.en.size]
known = "{company} is at ~{fte} people now."
unknown = "[You've been building {company} for X years / you're at N people]."

[languages.en.team]
known = "You already have {ae} people in sales."
unknown = "[One thing you noticed about the team.]"

# ------------------------------------------------------------------- German
[languages.de]
name = "German"
greeting = "Hallo {first},"
signoff = "{owner_first_name}"
observation = "[Was dir auf {site} aufgefallen ist, in einem Satz.]"

[languages.de.growth]
growing = "{company} wächst schnell."
stalled = "{company} ist weit gekommen, aber das Wachstum scheint etwas zu stocken."
declining = "{company} ist weit gekommen, aber das Team ist zuletzt kleiner geworden."
"" = "{company} [wächst schnell / ist weit gekommen]."

[languages.de.size]
known = "Ihr seid bei {company} inzwischen ~{fte} Leute."
unknown = "[Du arbeitest seit X Jahren an {company} / ihr seid N Leute]."

[languages.de.team]
known = "Ihr habt schon {ae} Leute im Vertrieb."
unknown = "[Was dir am Team aufgefallen ist.]"

# -------------------------------------------------------------------- Dutch
[languages.nl]
name = "Dutch"
greeting = "Hoi {first},"
signoff = "{owner_first_name}"
observation = "[Wat je opviel op {site}, in één zin.]"

[languages.nl.growth]
growing = "{company} groeit hard."
stalled = "{company} is ver gekomen, maar de groei lijkt wat af te vlakken."
declining = "{company} is ver gekomen, maar het team is de laatste tijd kleiner geworden."
"" = "{company} [groeit hard / is ver gekomen]."

[languages.nl.size]
known = "Jullie zijn met {company} inmiddels ~{fte} mensen."
unknown = "[Je bouwt al X jaar aan {company} / jullie zijn met N mensen]."

[languages.nl.team]
known = "Jullie hebben al {ae} mensen in sales."
unknown = "[Wat je opviel aan het team.]"

# ------------------------------------------------------------------- French
[languages.fr]
name = "French"
greeting = "Bonjour {first},"
signoff = "{owner_first_name}"
observation = "[Ce qui vous a frappé sur {site}, en une phrase.]"

[languages.fr.growth]
growing = "{company} se développe vite."
stalled = "{company} a fait beaucoup de chemin, mais la croissance semble marquer le pas."
declining = "{company} a fait beaucoup de chemin, mais l'équipe s'est réduite ces derniers temps."
"" = "{company} [se développe vite / a fait beaucoup de chemin]."

[languages.fr.size]
known = "Vous êtes désormais ~{fte} chez {company}."
unknown = "[Vous construisez {company} depuis X ans / vous êtes N]."

[languages.fr.team]
known = "Vous avez déjà {ae} personnes en vente."
unknown = "[Ce qui vous a frappé dans l'équipe.]"

# ------------------------------------------------------------ outreach bot
# Read by the outreach bot (hermitcrm/outreach.py), never by the templates
# above. Override any key in your messages.toml, like the wording.
#
# [culture.<language>]: starting points for a first message in that language.
# A [culture.<COUNTRY>] table (two capital letters, e.g. [culture.AT]) goes on
# top of its language's for one country. The playbook's Voice section wins
# over all of them. Each item shows which norms were applied, so you can
# correct them here.
#   formality  how to address them on first contact
#   greeting   how a first message opens ({first} is their first name)
#   signoff    how it closes
#   names      first name or title and surname
#   cta        how direct the one question at the end can be

[culture.en]
formality = "informal: you, first name"
greeting = "Hi {first},"
signoff = "Best,"
names = "first name, no titles"
cta = "a direct question is fine"

[culture.de]
formality = "informal: du (first contact too), first name"
greeting = "Hallo {first},"
signoff = "Viele Grüße"
names = "first name; no academic titles with du"
cta = "direct, but with a reason for the question"

[culture.nl]
formality = "informal: je, first name"
greeting = "Hoi {first},"
signoff = "Groet,"
names = "first name"
cta = "direct and to the point; Dutch readers value plain speaking"

[culture.fr]
formality = "formal: vous on first contact"
greeting = "Bonjour {first},"
signoff = "Bien à vous,"
names = "first name with Bonjour; never tu"
cta = "polite and indirect (Seriez-vous..., Qu'est-ce qui...)"

# [outreach]: shared rules. calendar_links: a draft that contains one of these
# is refused before they have answered (booking links lost real replies).
[outreach]
calendar_links = ["calendly.com", "cal.com/", "calendar.app.google", "calendar.google.com",
                  "outlook.office.com/bookwithme", "outlook.office365.com/book",
                  "bookings.cloud.microsoft", "meetings.hubspot.com", "hubspot.com/meetings",
                  "savvycal.com", "tidycal.com", "zcal.co", "youcanbook.me",
                  "acuityscheduling.com", "doodle.com", "koalendar.com"]

# [outreach.<channel>]: what a first touch on that channel may be.
[outreach.email]
subject_max = 60       # characters
body_max_words = 120   # greeting and sign-off included, the opt-out line not; one question
links = false          # no links in a first touch
opt_out = true         # add the playbook's opt_out line (if it has one) to a cold first email

[outreach.linkedin]
note_max_chars = 300   # LinkedIn's limit for a connection note; no pitch, at most one question
pitch_max_chars = 600  # the message after they accept, or to an existing connection; one question
links = false

# [outreach.reply_to_interest.<language>]: the shape of a reply to someone who
# answered and showed interest. The AI writes it in its own words around the
# offer line; a line whose slot is empty is left out (no first step offer, say).
# Never a time slot, a booking link or a price: they answer the question first.
# Slots: {first} {offer_line} {proof} {first_step_offer} {question}
[outreach.reply_to_interest.en]
template = "Hi {first},\nThanks for your reply. {offer_line}\n{proof}\n{first_step_offer}\n{question}"
question = "What would you most like to improve first?"

[outreach.reply_to_interest.de]
template = "Hallo {first},\ndanke für deine Antwort. {offer_line}\n{proof}\n{first_step_offer}\n{question}"
question = "Was möchtest du als Erstes verbessern?"

[outreach.reply_to_interest.nl]
template = "Hoi {first},\nDank voor je reactie. {offer_line}\n{proof}\n{first_step_offer}\n{question}"
question = "Wat wil je als eerste verbeteren?"

[outreach.reply_to_interest.fr]
template = "Bonjour {first},\nMerci pour votre réponse. {offer_line}\n{proof}\n{first_step_offer}\n{question}"
question = "Qu'aimeriez-vous améliorer en premier ?"

# [outreach.follow_up.<language>]: the shape of a follow-up to a message that got
# no answer. The AI writes it in its own words and fills {topic} from the first
# message; `topic` below is only the placeholder used until then. No calendar
# invite, no link, no time slot, one question, an easy way out.
# Slots: {first} {company} {topic} {offer_line} {question}. A line whose slots
# are all empty is left out; the default wording has no {offer_line} line, add
# one in messages.toml to repeat the offer.
[outreach.follow_up.en]
template = "Hi {first},\nQuick follow-up, no calendar invite: is {topic} a priority at {company} right now, or not really? A short 'not now' is fine too, then I'll close the loop."
topic = "the topic of my first message"

[outreach.follow_up.de]
template = "Hallo {first},\nkurzes Follow-up, ohne Kalendereinladung: Ist {topic} bei {company} gerade ein Thema, oder eher nicht? Ein kurzes „Jetzt nicht“ reicht auch, dann schließe ich das Thema ab."
topic = "das Thema meiner ersten Nachricht"

[outreach.follow_up.nl]
template = "Hoi {first},\nKorte follow-up, zonder agenda-uitnodiging: is {topic} bij {company} op dit moment een prioriteit, of niet echt? Een kort ‘nu niet’ is ook prima, dan sluit ik het af."
topic = "het onderwerp van mijn eerste bericht"

[outreach.follow_up.fr]
template = "Bonjour {first},\nUn bref suivi, sans invitation au calendrier : {topic} est-il une priorité chez {company} en ce moment, ou pas vraiment ? Un simple « pas maintenant » suffit aussi, je clôture alors le sujet."
topic = "le sujet de mon premier message"
