# Hermit CRM default outreach templates: neutral B2B angles in four languages.
#
# Do not edit this file in the package. Put a messages.toml in your data
# folder instead; it is deep-merged over this one, so a file that only sets
#
#   [languages.en]
#   signoff = "Best,\n{owner_first_name}"
#
# keeps everything else. Add a language by adding a [languages.xx] table and
# mapping countries to it (see LANGUAGE_BY_COUNTRY in hermitcrm/models.py).
#
# Slots: {first} {company} {growth} {size} {hurdle} {team} {observation}
#        {fte} {ae} {site} {owner_first_name}
# Square brackets mark what only you can fill in.

[signals]
"" = "not checked yet"
growing = "growing fast (LinkedIn insights)"
stalled = "growth levelling off"
declining = "headcount decline"
hiring = "hiring for a role you can help with"

[labels]
scale = "1. scale: they are growing, offer help to keep the pace"
bridge = "1. bridge: they are hiring, offer help while the role is open"
decline = "1. decline: a tough stretch, then an open question"
unblock = "2. unblock: past the next headcount hurdle"
hook = "3. hook: one observation, then an open question"

# ------------------------------------------------------------------ English
[languages.en]
name = "English"
greeting = "Hi {first},"
signoff = "{owner_first_name}"
scale = "{growth}\nTeams at that stage often want to keep the pace without adding headcount.\nWould a short call be worth it to see whether [your offer] fits {company}?"
bridge = "I saw that {company} is hiring for [the role].\nWhile the role is open, [your offer] can take some of the load, so the new hire gets a running start.\nOpen to a short chat?"
decline = "{growth}\n\n[One thing you noticed about the team.]\n\nWhat would make [your offer] worth considering for you?"
unblock = "{size}\nInterested in how similar teams got past the {hurdle}-people mark without the usual growing pains?\n\nHappy to share what worked for them."
hook = "{observation}\n{team}\nWhat would need to happen for [the problem you solve] to become a priority?"
observation = "[One thing that struck you on {site}, in one sentence.]"

[languages.en.growth]
growing = "{company} is growing fast."
stalled = "{company} has come a long way, but growth seems to be levelling off a bit."
declining = "{company} has come a long way, but the team has been getting smaller lately."
"" = "{company} [is growing fast / has come a long way]."

[languages.en.size]
known = "{company} is at ~{fte} people now."
unknown = "[You've been building {company} for X years / you're at N people]."

[languages.en.team]
known = "You already have {ae} people in sales."
unknown = "[One thing you noticed about the team.]"

# ------------------------------------------------------------------- German
[languages.de]
name = "German"
greeting = "Hallo {first},"
signoff = "{owner_first_name}"
scale = "{growth}\nIn dieser Phase wollen viele Teams das Tempo halten, ohne mehr Leute einzustellen.\nLohnt sich ein kurzes Gespräch, um zu sehen, ob [dein Angebot] zu {company} passt?"
bridge = "Ich habe gesehen, dass {company} [die Rolle] sucht.\nSolange die Stelle offen ist, kann [dein Angebot] einen Teil der Arbeit übernehmen, damit die neue Person mit Rückenwind startet.\nOffen für einen kurzen Austausch?"
decline = "{growth}\n\n[Was dir am Team aufgefallen ist.]\n\nWas wäre für dich ein Anlass, [dein Angebot] in Betracht zu ziehen?"
unblock = "{size}\nInteresse daran, wie ähnliche Teams die {hurdle}-Mitarbeiter-Marke ohne die üblichen Wachstumsschmerzen geschafft haben?\n\nIch teile gerne, was dort funktioniert hat."
hook = "{observation}\n{team}\nWas müsste passieren, damit [das Problem, das du löst] Priorität bekommt?"
observation = "[Was dir auf {site} aufgefallen ist, in einem Satz.]"

[languages.de.growth]
growing = "{company} wächst schnell."
stalled = "{company} ist weit gekommen, aber das Wachstum scheint etwas zu stocken."
declining = "{company} ist weit gekommen, aber das Team ist zuletzt kleiner geworden."
"" = "{company} [wächst schnell / ist weit gekommen]."

[languages.de.size]
known = "Ihr seid bei {company} inzwischen ~{fte} Leute."
unknown = "[Du arbeitest seit X Jahren an {company} / ihr seid N Leute]."

[languages.de.team]
known = "Ihr habt schon {ae} Leute im Vertrieb."
unknown = "[Was dir am Team aufgefallen ist.]"

# -------------------------------------------------------------------- Dutch
[languages.nl]
name = "Dutch"
greeting = "Hoi {first},"
signoff = "{owner_first_name}"
scale = "{growth}\nIn die fase willen veel teams het tempo vasthouden zonder extra mensen aan te nemen.\nIs een kort gesprek de moeite waard om te kijken of [jouw aanbod] bij {company} past?"
bridge = "Ik zag dat {company} [de rol] zoekt.\nZolang de vacature openstaat, kan [jouw aanbod] een deel van het werk oppakken, zodat de nieuwe collega een vliegende start maakt.\nZin in een kort gesprek?"
decline = "{growth}\n\n[Wat je opviel aan het team.]\n\nWat zou voor jou aanleiding zijn om [jouw aanbod] te overwegen?"
unblock = "{size}\nInteresse in hoe vergelijkbare teams voorbij de grens van {hurdle} medewerkers kwamen zonder de gebruikelijke groeipijn?\n\nIk deel graag wat voor hen werkte."
hook = "{observation}\n{team}\nWat zou er moeten gebeuren om [het probleem dat jij oplost] prioriteit te geven?"
observation = "[Wat je opviel op {site}, in één zin.]"

[languages.nl.growth]
growing = "{company} groeit hard."
stalled = "{company} is ver gekomen, maar de groei lijkt wat af te vlakken."
declining = "{company} is ver gekomen, maar het team is de laatste tijd kleiner geworden."
"" = "{company} [groeit hard / is ver gekomen]."

[languages.nl.size]
known = "Jullie zijn met {company} inmiddels ~{fte} mensen."
unknown = "[Je bouwt al X jaar aan {company} / jullie zijn met N mensen]."

[languages.nl.team]
known = "Jullie hebben al {ae} mensen in sales."
unknown = "[Wat je opviel aan het team.]"

# ------------------------------------------------------------------- French
[languages.fr]
name = "French"
greeting = "Bonjour {first},"
signoff = "{owner_first_name}"
scale = "{growth}\nÀ ce stade, beaucoup d'équipes veulent garder le rythme sans augmenter les effectifs.\nUn court échange vaudrait-il la peine pour voir si [votre offre] convient à {company} ?"
bridge = "J'ai vu que {company} recrute pour [le poste].\nPendant que le poste est ouvert, [votre offre] peut prendre une partie de la charge, pour que la nouvelle recrue démarre sur de bonnes bases.\nOuvert à un court échange ?"
decline = "{growth}\n\n[Ce qui vous a frappé dans l'équipe.]\n\nQu'est-ce qui vous amènerait à envisager [votre offre] ?"
unblock = "{size}\nIntéressé par la façon dont des équipes similaires ont franchi le cap des {hurdle} collaborateurs sans les difficultés habituelles ?\n\nJe partage volontiers ce qui a fonctionné pour elles."
hook = "{observation}\n{team}\nQu'est-ce qui ferait de [le problème que vous résolvez] une priorité ?"
observation = "[Ce qui vous a frappé sur {site}, en une phrase.]"

[languages.fr.growth]
growing = "{company} se développe vite."
stalled = "{company} a fait beaucoup de chemin, mais la croissance semble marquer le pas."
declining = "{company} a fait beaucoup de chemin, mais l'équipe s'est réduite ces derniers temps."
"" = "{company} [se développe vite / a fait beaucoup de chemin]."

[languages.fr.size]
known = "Vous êtes désormais ~{fte} chez {company}."
unknown = "[Vous construisez {company} depuis X ans / vous êtes N]."

[languages.fr.team]
known = "Vous avez déjà {ae} personnes en vente."
unknown = "[Ce qui vous a frappé dans l'équipe.]"
