name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The pinned versions in uv.lock, so CI and contributors test the same thing.
  # --locked fails the job if pyproject.toml changed without `uv lock`.
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Git identity for tests that commit
        run: |
          git config --global user.name "hermitcrm ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: Install
        run: uv sync --locked --extra dev
      - name: Test
        env:
          HERMITCRM_NO_UPDATE_CHECK: "1"
        run: uv run --locked pytest -q

  # Users never get uv.lock: `uv tool install` and pip resolve the newest
  # versions. This job does the same, so an upstream release that breaks
  # Hermit CRM shows up here before a user reports it.
  pytest-latest-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Git identity for tests that commit
        run: |
          git config --global user.name "hermitcrm ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        env:
          HERMITCRM_NO_UPDATE_CHECK: "1"
        run: python -m pytest -q

  # The Linux Secret Service for real: secret-tool against no daemon (must read
  # as "no keyring"), then against an unlocked gnome-keyring. The pytest job
  # above only ever sees a fake secret-tool.
  keyring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsecret-tools dbus
          python -m pip install -e '.[dev]'
      - name: secret-tool without a Secret Service
        env:
          HERMITCRM_KEYRING_CI: no-daemon
        run: dbus-run-session -- python -m pytest -q -rs tests/test_secret_service_real.py
      - name: Install gnome-keyring
        run: sudo apt-get install -y --no-install-recommends gnome-keyring
      - name: secret-tool with an unlocked gnome-keyring
        env:
          HERMITCRM_KEYRING_CI: running
        run: |
          dbus-run-session -- sh -c '
            printf "ci-password" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            python -m pytest -q -rs tests/test_secret_service_real.py'
