name: Bug report
description: Something does not work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Three things help the most: what you ran, what you expected, and what happened.

        **Please do not paste real customer or contact data.** Replace names and addresses with made-up ones. If you found a security problem, do not open an issue: use [private reporting](https://github.com/Hermit-CRM/hermit-crm/security/advisories/new) instead.
  - type: textarea
    id: ran
    attributes:
      label: What did you run or click?
      description: The command, the page, the buttons, in order.
      placeholder: "I opened Companies, clicked Import a spreadsheet, and chose a CSV file."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened instead?
      description: Include the error message or a screenshot if there is one.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hermit CRM version
      description: Run `hermitcrm --version`.
      placeholder: "hermitcrm 1.0.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Your computer
      description: The operating system and version, and how you installed Hermit CRM (AI assistant, `uv tool install`, download).
      placeholder: "macOS 15, installed with uv tool install"
    validations:
      required: true
  - type: input
    id: ai-tool
    attributes:
      label: AI tool (only if the problem involves Enrich, Ask Hermit or drafts)
      placeholder: "Claude Code, Codex, Cursor, Gemini CLI"
